name: CI

on:
  push:
    branches: ["*"]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff mypy coverage
      - name: Ruff
        run: ruff check .
      - name: Mypy
        run: mypy couples_bot workers
      - name: Pytest with coverage
        run: coverage run -m pytest
      - name: Coverage metrics
        run: |
          coverage report --include "couples_bot/metrics/*" --fail-under=90
          coverage report --include "couples_bot/alerts/*" --fail-under=90
          coverage report --include "couples_bot/llm/*" --fail-under=90
          coverage report --include "workers/*,couples_bot/db_jobs.py" --fail-under=85
